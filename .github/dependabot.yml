# Dependabot keeps dependencies current. Only ecosystems whose manifest already exists are enabled;
# enabling one for a folder without a manifest only produces Dependabot errors.
# Scaffold PRs add or enable a non-overlapping entry for the component's actual manifest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Stay on the agreed PostgreSQL 18 line; review major upgrades explicitly.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Add a separate directory: /payment-gateway entry when its pom.xml exists;
  # do not add /backend to a second Maven entry.


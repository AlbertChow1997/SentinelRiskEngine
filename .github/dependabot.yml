# Dependabot keeps dependencies current. Only ecosystems whose manifest already exists are enabled;
# enabling one for a folder without a manifest only produces Dependabot errors.
# The PR that scaffolds a component uncomments its block below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Stay on the agreed PostgreSQL 18 line; review major upgrades explicitly.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # - package-ecosystem: maven
  #   directories: ["/backend", "/payment-gateway"]
  #   schedule: { interval: weekly }
  #   commit-message: { prefix: "chore(deps)" }

  # - package-ecosystem: uv
  #   directories: ["/ml-scorer", "/llm-insights"]
  #   schedule: { interval: weekly }
  #   commit-message: { prefix: "chore(deps)" }

  # Enabled with the frontend scaffold (RISK-30, follow-up from #13).
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*", "eslint-plugin-storybook"]
      playwright:
        patterns: ["@playwright/test", "playwright-core"]


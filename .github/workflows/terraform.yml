name: terraform
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml', '.terraform-version']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml', '.terraform-version']
  workflow_dispatch:
permissions:
  contents: read
env:
  # The AWS project is locked to this Region (ADR-0015).
  AWS_REGION: eu-north-1
# No workflow-level concurrency: cancelling a run mid-plan would leave the S3 state lock behind.
# Read-only jobs cancel superseded PR runs; the plan job never cancels.
jobs:
  checks:
    name: Repository-wide checks (fmt, TFLint, Trivy, operations scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-checks-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: TFLint every root and module (pinned official image)
        run: |
          docker run --rm -v "$PWD":/work -w /work --entrypoint sh ghcr.io/terraform-linters/tflint:v0.66.0 -c 'tflint --init --config /work/infra/terraform/.tflint.hcl && for dir in infra/terraform/bootstrap infra/terraform/envs/staging infra/terraform/modules/*; do test -d "$dir" || continue; tflint --chdir "$dir" --config /work/infra/terraform/.tflint.hcl || exit 1; done'
      - name: Trivy configuration scan
        run: docker run --rm -v "$PWD":/work aquasec/trivy:0.76.2 config --exit-code 1 --severity HIGH,CRITICAL /work/infra/terraform
      - name: Operations script tests (fake AWS CLI only)
        run: python3 -m unittest discover -s infra/scripts/tests -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-validate-${{ github.ref }}-${{ matrix.root }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      matrix:
        root: [bootstrap, envs/staging]
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - name: Initialise without backend, validate and mock-plan tests
        env:
          TF_ROOT: infra/terraform/${{ matrix.root }}
        run: |
          terraform -chdir="$TF_ROOT" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="$TF_ROOT" validate
          terraform -chdir="$TF_ROOT" test

  plan:
    # No credentials on forks, push events, Dependabot runs (no OIDC token), or before
    # approved bootstrap/configuration. Dependabot bumps are planned manually.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      vars.TF_PLAN_ENABLED == 'true'
    needs: [checks, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-plan-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "terraform=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
      - name: Plan staging (never apply)
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_owner: ${{ vars.INFRA_OWNER }}
          # Unset repository variable -> "" -> the module creates the provider.
          TF_VAR_existing_github_oidc_provider_arn: ${{ vars.TF_OIDC_PROVIDER_ARN }}
        run: |
          # Full logs stay on the runner; on failure print only the error blocks.
          fail() { grep -E -A6 '^(│ )?Error' "$1" || tail -n 5 "$1"; exit 1; }
          cd infra/terraform/envs/staging
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config=key=staging/terraform.tfstate -backend-config=region="$AWS_REGION" -backend-config=use_lockfile=true -backend-config=encrypt=true > /tmp/tf-init.log 2>&1 || fail /tmp/tf-init.log
          terraform plan -input=false -out=tfplan > /tmp/tf-plan.log 2>&1 || fail /tmp/tf-plan.log
          terraform show -json tfplan | python ../../../scripts/summarize-plan.py > /tmp/plan-summary.md
          cat /tmp/plan-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update the single resource-count summary comment (no state, IDs, secrets or plan artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr comment "$PR" --body-file /tmp/plan-summary.md --edit-last --create-if-none

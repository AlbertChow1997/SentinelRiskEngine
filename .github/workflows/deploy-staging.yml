name: deploy-staging
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_STAGING: publish images/site and start EC2 if stopped (incurs AWS cost)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require main, explicit intent and configured deployment
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Deployment must target main.'; exit 1; }
          test "$CONFIRMATION" = DEPLOY_STAGING || { echo 'Explicit DEPLOY_STAGING confirmation is required.'; exit 1; }
          test "$ENABLED" = true || { echo 'Staging deployment remains disabled until AWS and reviewer prerequisites are verified.'; exit 1; }
      - name: Verify actual reviewer gate before any AWS access
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/staging" > /tmp/staging-environment.json
          gh api "repos/$GH_REPO/environments/staging/deployment-branch-policies" > /tmp/staging-branches.json
          python3 infra/scripts/deployment_gate.py /tmp/staging-environment.json /tmp/staging-branches.json
  prepare:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify and build frontend shell
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Build ARM64 application/proxy images (backend Dockerfile runs Maven verify)
        run: |
          docker build --platform linux/arm64 -t sentinel-risk-engine:staging backend
          docker build --platform linux/arm64 -t sentinel-nginx:staging infra/nginx
      - name: Scan images before publishing
        run: |
          for image in risk-engine nginx; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy-cache":/root/.cache/trivy aquasec/trivy:0.76.2 image --scanners vuln --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL "sentinel-$image:staging"
          done
      - name: Package verified build outputs without credentials
        run: |
          mkdir -p .staging-artifact/frontend
          cp -R frontend/dist/. .staging-artifact/frontend/
          docker save sentinel-risk-engine:staging sentinel-nginx:staging | gzip > .staging-artifact/images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: staging-${{ github.sha }}
          path: .staging-artifact/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # The real GitHub reviewer approves these prepared artifacts before this job.
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: staging-${{ github.sha }}
          path: .staging-artifact/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true
      - name: Publish, wake, deploy and smoke (no Terraform apply)
        env:
          STAGING_ECR_REGISTRY: ${{ vars.STAGING_ECR_REGISTRY }}
          STAGING_WEBSITE_BUCKET: ${{ vars.STAGING_WEBSITE_BUCKET }}
          STAGING_DISTRIBUTION_ID: ${{ vars.STAGING_DISTRIBUTION_ID }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          INFRA_OWNER: ${{ vars.INFRA_OWNER }}
        run: bash infra/scripts/deploy-staging.sh

name: contracts

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenAPI and AsyncAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Lint OpenAPI contracts (Redocly)
        run: npx --yes @redocly/cli@2 lint --config contracts/redocly.yaml contracts/openapi-*.yaml

      - name: Validate AsyncAPI contracts
        run: |
          npx --yes @asyncapi/cli@6 config analytics --disable
          for f in contracts/asyncapi-*.yaml; do
            npx --yes @asyncapi/cli@6 validate "$f"
          done

  breaking-changes:
    name: Detect breaking changes (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare each OpenAPI contract with the base branch
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          bash contracts/check-breaking.sh

name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      # api-proxy.test.ts checks the dev proxy against the staging nginx routes.
      - "infra/nginx/default.conf.template"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "contracts/**"
      # api-proxy.test.ts checks the dev proxy against the staging nginx routes.
      - "infra/nginx/default.conf.template"
      - ".github/workflows/ci-frontend.yml"

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run build-storybook -- --quiet

      # Real-browser accessibility (axe, WCAG 2.0/2.1 A + AA incl. colour contrast) on the
      # preview build and on every Storybook story, plus smoke tests.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

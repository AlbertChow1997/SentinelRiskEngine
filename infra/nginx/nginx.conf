worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 1m;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  log_format safe '$remote_addr "$request_method $uri" $status $request_time';
  access_log /dev/stdout safe;
  # The origin-secret map uses the secret (32-128 characters) as its key; the default
  # bucket size (64 on Graviton) cannot hold a 64-character key and nginx refuses to start.
  map_hash_bucket_size 256;
  include /etc/nginx/conf.d/*.conf;
}

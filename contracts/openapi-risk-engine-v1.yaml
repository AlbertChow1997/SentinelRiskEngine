openapi: 3.1.0
info:
  title: Sentinel Risk Engine — Public API
  version: 1.1.0
  summary: Real-time transaction risk assessment and analyst review.
  description: |
    Producer: **Backend (Jiawei Zhou)** · Consumers: **Frontend (Jiajun Xiao)**, Payment Gateway (Phase 2).

    - All timestamps are UTC, ISO 8601.
    - All JSON field names are camelCase.
    - Errors use RFC 9457 Problem Details (`application/problem+json`).
    - Changes to this file require approval from both producer and consumer (see CODEOWNERS).
    - Endpoints tagged **Should-have** may slip to v1.1 without breaking the contract.
    - **1.1.0 (v2.0 platform, additive only):** `paymentStatus` and `fraudConfirmed` on RiskAssessment, populated from
      Kafka `payments.events.v1`. When called by the Payment Gateway, `transactionId` = `paymentId`.
servers:
  - url: http://localhost:8081
    description: Local (docker-compose / IntelliJ)
tags:
  - name: Assessments
  - name: Review
  - name: Stats
  - name: Blocklist
    description: Should-have for v1.0
  - name: Operations

paths:
  /api/v1/risk-assessments:
    post:
      tags: [Assessments]
      operationId: createRiskAssessment
      summary: Assess the risk of a transaction
      description: |
        Runs Java rules and the ML scorer, combines the scores and returns a decision.
        **Idempotent on `transactionId`:** re-sending the same payload returns the original
        assessment (200). Same `transactionId` with a different payload returns 409.
        If the ML scorer is unavailable, the decision is made on rules only and `degraded = true`.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAssessmentRequest'
            examples:
              normal:
                value:
                  transactionId: tx-001
                  customerId: cust-001
                  merchantId: merch-001
                  amount: 49.99
                  currency: EUR
                  countryCode: IE
                  transactionTime: '2026-11-18T09:59:00Z'
      responses:
        '200':
          description: Assessment completed (or idempotent replay).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      tags: [Assessments]
      operationId: listRiskAssessments
      summary: Search assessments (paged)
      parameters:
        - name: decision
          in: query
          schema: { $ref: '#/components/schemas/RiskDecision' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssessmentStatus' }
        - name: customerId
          in: query
          schema: { type: string }
        - name: minScore
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
        - name: from
          in: query
          description: Inclusive lower bound on assessedAt.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Exclusive upper bound on assessedAt.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          description: 'Field and direction. Allowed fields: assessedAt, riskScore, amount.'
          schema: { type: string, default: 'assessedAt,desc', example: 'riskScore,desc' }
      responses:
        '200':
          description: One page of results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentPage'
        '400':
          $ref: '#/components/responses/Problem'

  /api/v1/risk-assessments/{assessmentId}:
    get:
      tags: [Assessments]
      operationId: getRiskAssessment
      summary: Get one assessment
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: The assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/risk-assessments/{assessmentId}/review:
    post:
      tags: [Review]
      operationId: reviewRiskAssessment
      summary: Record an analyst decision on a REVIEW case
      description: Only allowed when `status = PENDING_REVIEW`. Moves status to `REVIEWED`.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Updated assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/risk-assessments/{assessmentId}/audit-events:
    get:
      tags: [Assessments]
      operationId: listAuditEvents
      summary: Audit trail of one assessment (oldest first)
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/stats/summary:
    get:
      tags: [Stats]
      operationId: getStatsSummary
      summary: KPI summary for the dashboard
      parameters:
        - name: from
          in: query
          description: Defaults to 24 hours before `to`.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'

  /api/v1/blocklist:
    get:
      tags: [Blocklist]
      operationId: listBlocklistEntries
      summary: List blocklist entries (Should-have)
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/BlocklistType' }
      responses:
        '200':
          description: All matching entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlocklistEntry'
    post:
      tags: [Blocklist]
      operationId: createBlocklistEntry
      summary: Add a customer or merchant to the blocklist (Should-have)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistEntryRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlocklistEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/blocklist/{entryId}:
    delete:
      tags: [Blocklist]
      operationId: deleteBlocklistEntry
      summary: Remove a blocklist entry (Should-have)
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'

  /actuator/health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }

components:
  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID. Generated by the backend if absent and forwarded to the ML scorer.
      schema: { type: string, maxLength: 64 }

  headers:
    RequestId:
      description: Correlation ID echoed back.
      schema: { type: string }

  schemas:
    RiskDecision:
      type: string
      enum: [APPROVE, REVIEW, DECLINE]

    AssessmentStatus:
      type: string
      enum: [AUTO_DECIDED, PENDING_REVIEW, REVIEWED]
      description: |
        - `AUTO_DECIDED` — engine decided APPROVE or DECLINE
        - `PENDING_REVIEW` — engine decided REVIEW; waiting for an analyst
        - `REVIEWED` — analyst recorded a final decision

    RiskAssessmentRequest:
      type: object
      required: [transactionId, customerId, merchantId, amount, currency, countryCode, transactionTime]
      properties:
        transactionId: { type: string, minLength: 1, maxLength: 64, example: tx-001 }
        customerId: { type: string, minLength: 1, maxLength: 64, example: cust-001 }
        merchantId: { type: string, minLength: 1, maxLength: 64, example: merch-001 }
        amount:
          type: number
          exclusiveMinimum: 0
          description: Major units. Max 12 integer digits, 2 decimals.
          example: 49.99
        currency: { type: string, pattern: '^[A-Z]{3}$', example: EUR }
        countryCode: { type: string, pattern: '^[A-Z]{2}$', example: IE }
        transactionTime:
          type: string
          format: date-time
          description: Must not be in the future.

    RuleHit:
      type: object
      required: [code, description, scoreImpact, hardDecline]
      properties:
        code: { type: string, example: AMOUNT_ABOVE_THRESHOLD }
        description: { type: string, example: 'Amount 7,500.00 EUR is above the 5,000.00 threshold' }
        scoreImpact: { type: integer, minimum: 0, maximum: 100, example: 40 }
        hardDecline: { type: boolean, description: 'If true, decision is DECLINE regardless of score.' }

    MlFactor:
      type: object
      required: [feature, description, contribution]
      properties:
        feature: { type: string, example: amountToAvgRatio }
        description: { type: string, example: 'Amount is 12.4x the customer 30-day average' }
        contribution:
          type: number
          description: Positive = increases risk, negative = decreases risk.
          example: 0.42

    Review:
      type: object
      required: [decision, reviewer, reviewedAt]
      properties:
        decision: { type: string, enum: [APPROVE, DECLINE] }
        reviewer: { type: string }
        note: { type: [string, 'null'] }
        reviewedAt: { type: string, format: date-time }

    RiskAssessment:
      type: object
      required:
        - assessmentId
        - transactionId
        - customerId
        - merchantId
        - amount
        - currency
        - countryCode
        - transactionTime
        - decision
        - status
        - riskScore
        - ruleScore
        - degraded
        - reasons
        - ruleHits
        - mlFactors
        - assessedAt
      properties:
        assessmentId: { type: string, format: uuid }
        transactionId: { type: string }
        customerId: { type: string }
        merchantId: { type: string }
        amount: { type: number }
        currency: { type: string }
        countryCode: { type: string }
        transactionTime: { type: string, format: date-time }
        decision:
          $ref: '#/components/schemas/RiskDecision'
        finalDecision:
          description: Equals `decision` when AUTO_DECIDED, the analyst's decision when REVIEWED, null while PENDING_REVIEW.
          oneOf:
            - type: string
              enum: [APPROVE, DECLINE]
            - type: 'null'
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        riskScore: { type: integer, minimum: 0, maximum: 100, description: Final combined score. }
        ruleScore: { type: integer, minimum: 0, maximum: 100 }
        mlScore: { type: [integer, 'null'], minimum: 0, maximum: 100, description: Null when degraded. }
        modelVersion: { type: [string, 'null'], example: hgb-1.0.0 }
        degraded: { type: boolean, description: True when the ML scorer was unavailable. }
        reasons:
          type: array
          description: Reason codes (rule codes plus ML_HIGH_RISK / ML_UNAVAILABLE). Kept for backward compatibility with the Sprint 1 contract.
          items: { type: string }
        ruleHits:
          type: array
          items: { $ref: '#/components/schemas/RuleHit' }
        mlFactors:
          type: array
          items: { $ref: '#/components/schemas/MlFactor' }
        review:
          oneOf:
            - $ref: '#/components/schemas/Review'
            - type: 'null'
        assessedAt: { type: string, format: date-time }
        paymentStatus:
          type: [string, 'null']
          description: (1.1.0) Latest payment status from the gateway's events; null if not a gateway payment or no event yet.
          example: CAPTURED
        fraudConfirmed:
          type: boolean
          default: false
          description: (1.1.0) True once a FRAUDULENT refund event is received for this payment (ground-truth label).

    ReviewRequest:
      type: object
      required: [decision, reviewer]
      properties:
        decision: { type: string, enum: [APPROVE, DECLINE] }
        reviewer: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 500 }

    AuditEvent:
      type: object
      required: [id, eventType, actor, createdAt]
      properties:
        id: { type: integer, format: int64 }
        eventType: { type: string, enum: [ASSESSED, IDEMPOTENT_REPLAY, REVIEWED] }
        actor: { type: string, description: "'system' or the reviewer name" }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer, description: Zero-based page index. }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    AssessmentPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RiskAssessment' }
        page:
          $ref: '#/components/schemas/PageMetadata'

    StatsSummary:
      type: object
      required: [from, to, totalAssessments, decisions, pendingReview, averageRiskScore, degradedCount, scoreHistogram]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totalAssessments: { type: integer, format: int64 }
        decisions:
          type: object
          required: [APPROVE, REVIEW, DECLINE]
          properties:
            APPROVE: { type: integer, format: int64 }
            REVIEW: { type: integer, format: int64 }
            DECLINE: { type: integer, format: int64 }
        pendingReview: { type: integer, format: int64 }
        averageRiskScore: { type: number }
        degradedCount: { type: integer, format: int64 }
        scoreHistogram:
          type: array
          description: 10 buckets — 0-9, 10-19, …, 90-100.
          items:
            type: object
            required: [bucketStart, count]
            properties:
              bucketStart: { type: integer }
              count: { type: integer, format: int64 }

    BlocklistType:
      type: string
      enum: [CUSTOMER, MERCHANT]

    BlocklistEntryRequest:
      type: object
      required: [type, value]
      properties:
        type: { $ref: '#/components/schemas/BlocklistType' }
        value: { type: string, minLength: 1, maxLength: 64 }
        reason: { type: string, maxLength: 255 }
        createdBy: { type: string, maxLength: 100 }

    BlocklistEntry:
      allOf:
        - $ref: '#/components/schemas/BlocklistEntryRequest'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    ProblemDetail:
      type: object
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Machine-readable error code, e.g. IDEMPOTENCY_CONFLICT, INVALID_STATUS_TRANSITION.

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: string }

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    ValidationError:
      description: Malformed body or field validation failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          example:
            type: about:blank
            title: Validation failed
            status: 400
            detail: One or more fields are invalid.
            errors:
              amount: must be greater than 0
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Idempotency conflict, duplicate blocklist entry, or invalid status transition.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: Assessment is not pending review.
            code: INVALID_STATUS_TRANSITION

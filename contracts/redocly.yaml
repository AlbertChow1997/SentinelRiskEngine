# Redocly CLI lint configuration for the OpenAPI contracts.
# Used by `make contracts` and .github/workflows/contracts.yml.
extends:
  - recommended

rules:
  # Every operation declares or inherits authentication; public health is explicit.
  security-defined: error
  # Local-only server URLs are deliberate until the staging URL exists.
  no-server-example.com: off
  # The repository LICENSE (MIT) covers the contracts; no per-file licence block.
  info-license: off
